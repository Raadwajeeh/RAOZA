services:
  postgres:
    image: postgres:17-alpine
    container_name: raoza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raoza
      POSTGRES_USER: raoza
      POSTGRES_PASSWORD: raoza
    ports:
      - "5432:5432"
    volumes:
      - raoza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raoza -d raoza"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  raoza_pgdata:
