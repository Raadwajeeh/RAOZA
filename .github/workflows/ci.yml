name: RAOZA CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PAYMENT_PROVIDER: mollie
      MOLLIE_API_KEY: test_placeholder_not_used_by_unit_tests
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Laravel writable paths
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          chmod -R u+rwX,g+rwX bootstrap/cache storage
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: php artisan production:verify-build
      - run: php artisan test

  mariadb-commerce:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: raoza_phase7d2_ci
          MARIADB_USER: raoza_phase7d2_runner
          MARIADB_PASSWORD: raoza_phase7d2_password
          MARIADB_ROOT_PASSWORD: root_ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: raoza_phase7d2_ci
      DB_USERNAME: raoza_phase7d2_runner
      DB_PASSWORD: raoza_phase7d2_password
      DB_ISOLATION_LEVEL: READ COMMITTED
      DB_URL: ''
      DATABASE_URL: ''
      RAOZA_MARIADB_TEST_OPT_IN: phase7d2-disposable
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Laravel writable paths
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          chmod -R u+rwX,g+rwX bootstrap/cache storage
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Validate MariaDB schema and commerce concurrency
        run: |
          php vendor/bin/phpunit -c phpunit.mariadb.xml --list-tests | tee /tmp/raoza-mariadb-tests.txt
          test_count=$(grep -c '^ - ' /tmp/raoza-mariadb-tests.txt)
          echo "MariaDB tests discovered: ${test_count}"
          test "${test_count}" -eq 19
          grep -Fq 'test_invoice_numbers_are_unique_and_sequential_under_concurrency' /tmp/raoza-mariadb-tests.txt
          grep -Fq 'test_order_row_lock_excludes_a_second_shipping_transaction_on_mariadb' /tmp/raoza-mariadb-tests.txt
          php vendor/bin/phpunit -c phpunit.mariadb.xml --testdox

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      CACHE_STORE: array
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PAYMENT_PROVIDER: demo
      RAOZA_DEMO_MODE: true
      INVOICE_ISSUANCE_ENABLED: false
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Laravel writable paths
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          chmod -R u+rwX,g+rwX bootstrap/cache storage
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner --exit-code=1
