name: RAOZA CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PAYMENT_PROVIDER: mollie
      MOLLIE_API_KEY: test_placeholder_not_used_by_unit_tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: php artisan production:verify-build
      - run: php artisan test

  mariadb-commerce:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: raoza_phase7d2_ci
          MARIADB_USER: raoza_phase7d2_runner
          MARIADB_PASSWORD: raoza_phase7d2_password
          MARIADB_ROOT_PASSWORD: root_ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: raoza_phase7d2_ci
      DB_USERNAME: raoza_phase7d2_runner
      DB_PASSWORD: raoza_phase7d2_password
      DB_ISOLATION_LEVEL: READ COMMITTED
      DB_URL: ''
      DATABASE_URL: ''
      RAOZA_MARIADB_TEST_OPT_IN: phase7d2-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Validate MariaDB schema and commerce concurrency
        run: php vendor/bin/phpunit -c phpunit.mariadb.xml
